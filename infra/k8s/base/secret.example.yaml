# 【關卡 23】Secret 長這樣，但這個檔案「只是範本」，kustomization.yaml 沒有把它列進去，真值永遠不進 git。
# CI 用 kubectl create secret generic backend-secret --from-literal=... 建（.github/workflows/infra.yml 的 k8s job）；
# 正式叢集用雲端的 secret manager（AWS Secrets Manager、GCP Secret Manager）同步進來，或 Sealed Secrets / SOPS 加密後才進 git。
# stringData：寫明文，k8s 存的時候會自己 base64；data 則要自己先 base64。Secret 預設只是 base64 不是加密，叢集要另外開 encryption at rest。
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://user:password@host:5432/dbname
  JWT_SECRET: 請換成至少32個字元的隨機字串
