# [Stage 5] Alembic config file (read by every `alembic` command).
# NOTE: keep this file ASCII-only. Alembic reads it with the system default
# encoding, which is not UTF-8 on Windows, so non-ASCII text breaks it.
# The database URL is NOT set here: migrations/env.py reads DATABASE_URL
# from config.py (i.e. backend/.env).

[alembic]
# Folder that holds the migration scripts
script_location = %(here)s/migrations
# Lets env.py import config.py and models.py from backend/
prepend_sys_path = .
path_separator = os
# Migration file name: <rev>_<message>.py (rev is set with --rev-id, e.g. 0001)
file_template = %%(rev)s_%%(slug)s

# ---- Logging config below, no need to change ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
