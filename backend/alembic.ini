# 【關卡 5】Alembic 的設定檔（執行 alembic 指令時會讀這個檔案）
# 資料庫連線字串不寫在這裡，而是在 migrations/env.py 從 config.py 讀（也就是 .env 的 DATABASE_URL）

[alembic]
# 遷移檔放在哪個資料夾
script_location = %(here)s/migrations
# 讓 env.py 可以 import backend 裡的 config、models
prepend_sys_path = .
path_separator = os
# 遷移檔的檔名格式：編號_說明.py（編號用 --rev-id 指定，例如 0001、0002）
file_template = %%(rev)s_%%(slug)s

# ---- 以下是 log 設定，不用動 ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
